<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- interactive-widget: the on-screen keyboard shrinks the viewport instead of
         overlaying it, so a bottom-anchored composer stays visible while typing -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#F7F5F0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141413" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Primary SEO -->
    <title>Heloword</title>
    <meta name="description" content="Heloword | A versatile platform" />
    <meta name="keywords" content="English & Japanese & More" />
    <meta name="author" content="Heloword" />
    <link rel="canonical" href="https://heloword.com/" />

    <!-- hreflang for multilingual SEO -->
    <link rel="alternate" hreflang="zh-TW" href="https://heloword.com/" />
    <link rel="alternate" hreflang="en"    href="https://heloword.com/" />
    <link rel="alternate" hreflang="ja"    href="https://heloword.com/" />
    <link rel="alternate" hreflang="x-default" href="https://heloword.com/" />

    <!-- Open Graph (Facebook / LINE / Discord previews) -->
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://heloword.com/" />
    <meta property="og:site_name"   content="Heloword" />
    <meta property="og:title"       content="Heloword | A versatile platform" />
    <meta property="og:description" content="English & Japanese & More" />
    <meta property="og:image"       content="https://heloword.com/og-image.png" />
    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale"       content="zh_TW" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:locale:alternate" content="ja_JP" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="Heloword | A versatile platform" />
    <meta name="twitter:description" content="English & Japanese & More" />
    <meta name="twitter:image"       content="https://heloword.com/og-image.png" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Heloword",
      "url": "https://heloword.com/",
      "description": "Heloword | A versatile platform",
      "applicationCategory": "EducationApplication",
      "operatingSystem": "Web, iOS, Android",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "inLanguage": ["zh-TW", "en", "ja"],
      "keywords": "English & Japanese & More",
      "educationalUse": "Practice",
      "learningResourceType": "Quiz",
      "about": [
        { "@type": "Thing", "name": "英文單字學習" },
        { "@type": "Thing", "name": "日文單字學習" },
        { "@type": "Thing", "name": "間隔重複記憶法" },
        { "@type": "Thing", "name": "Ebbinghaus Forgetting Curve" }
      ]
    }
    </script>
    <!-- Fonts: Inter (latin) + Noto Sans/Serif TC & JP (CJK, auto-subset by unicode-range) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+JP:wght@400;500&family=Noto+Sans+TC:wght@400;500&family=Noto+Serif+JP:wght@500;600&family=Noto+Serif+TC:wght@500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
